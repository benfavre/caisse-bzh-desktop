<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>caisse.bzh — hors connexion</title>
<style>
  html,body{margin:0;height:100%;background:#102A43;color:#FBF7EE;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .bar{width:220px;height:14px;border-radius:7px;background:#FFC629}
  .paper{width:190px;height:120px;margin-top:-8px;background:#FBF7EE;border-radius:0 0 6px 6px}
  h1{font-size:26px;margin:10px 0 0}
  p{max-width:44ch;color:#c9d4e0;line-height:1.5;margin:0}
  button{margin-top:6px;height:50px;padding:0 26px;border:0;border-radius:12px;background:#FFC629;color:#102A43;font-weight:700;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="bar"></div><div class="paper"></div>
  <h1>caisse.bzh n'est pas joignable</h1>
  <p>Vérifiez la connexion Internet de cet appareil. La caisse se reconnecte automatiquement dès que le réseau revient.</p>
  <button id="retry" type="button">Réessayer maintenant</button>
</main>
<script>
  // The main process navigates back to the till; this page only asks for it.
  document.getElementById("retry").addEventListener("click", function () { location.hash = "retry-" + Date.now(); });
</script>
</body>
</html>
