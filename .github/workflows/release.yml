name: Desktop releases
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            flags: --linux --x64
          - os: windows-latest
            platform: windows
            flags: --win --x64
          - os: macos-latest
            platform: macos
            flags: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers and update manifests
        run: npm run dist -- ${{ matrix.flags }}
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          REQUIRE_MAC_SIGNING: ${{ runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      - name: Verify macOS signature, notarization ticket and Gatekeeper
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "Development build uses ad-hoc signing."
            exit 0
          fi
          shopt -s nullglob
          apps=(release/mac*/*.app)
          [[ ${#apps[@]} -eq 2 ]]
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            signature="$(codesign --display --verbose=4 "$app" 2>&1)"
            [[ "$signature" == *"Authority=Developer ID Application:"* ]]
            [[ "$signature" == *"TeamIdentifier=$APPLE_TEAM_ID"* ]]
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            plutil -extract LSMinimumSystemVersion raw -o - "$app/Contents/Info.plist"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure version matches release tag
        run: node -e "if ('v'+require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - name: Publish complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --title "caisse.bzh $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
