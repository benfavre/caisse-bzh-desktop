name: Microsoft Store package

on:
  workflow_dispatch:
    inputs:
      preparation:
        description: 'Use a provisional identity while account verification is pending (cannot be submitted)'
        type: boolean
        default: true
      identity_name:
        description: 'Exact Package/Identity/Name from Partner Center, required for a final build'
        type: string
      publisher:
        description: 'Exact Package/Identity/Publisher (CN=...) from Partner Center, required for a final build'
        type: string
      test_install:
        description: 'Install a temporary signed copy on the isolated Windows runner (preparation only)'
        type: boolean
        default: false
      run_wack:
        description: 'Attempt Windows App Certification Kit if installed and the runner has an active desktop'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      STORE_PREPARATION: ${{ inputs.preparation }}
      STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
      STORE_PUBLISHER: ${{ inputs.publisher }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      STORE_RUN_WACK: ${{ inputs.run_wack }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build unsigned Store package (Microsoft signs certified submissions)
        run: npm run dist:store
      - name: Validate manifest and packaged runtime
        id: validation
        shell: pwsh
        run: ./scripts/validate-store-package.ps1
      - name: Test isolated installation and package activation
        if: inputs.preparation && inputs.test_install
        shell: powershell
        run: ./scripts/test-store-install.ps1
      - uses: actions/upload-artifact@v4
        if: always() && steps.validation.outcome == 'success'
        with:
          name: microsoft-store-x64${{ inputs.preparation && '-preparation' || '' }}
          path: |
            release/store/*.appx
            release/store/AppxManifest.xml
            release/store/executable-manifest.xml
            release/store/package-validation.json
            release/store/wack-report.xml
          if-no-files-found: error
          retention-days: 30
