name: Microsoft Store package

on:
  workflow_dispatch:
    inputs:
      preparation:
        description: 'Use a provisional identity while account verification is pending (cannot be submitted)'
        type: boolean
        default: true
      identity_name:
        description: 'Exact Package/Identity/Name from Partner Center, required for a final build'
        type: string
      publisher:
        description: 'Exact Package/Identity/Publisher (CN=...) from Partner Center, required for a final build'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      STORE_PREPARATION: ${{ inputs.preparation }}
      STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
      STORE_PUBLISHER: ${{ inputs.publisher }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build unsigned Store package (Microsoft signs certified submissions)
        run: npm run dist:store
      - name: Validate manifest and packaged runtime
        shell: pwsh
        run: ./scripts/validate-store-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-x64${{ inputs.preparation && '-preparation' || '' }}
          path: |
            release/store/*.appx
            release/store/AppxManifest.xml
            release/store/package-validation.json
          if-no-files-found: error
          retention-days: 30
